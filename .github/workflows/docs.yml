name: Docs

# 仅手动触发：文档站（VitePress + typedoc API）按需部署到 Cloudflare Pages。
# 需要 secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、
# CLOUDFLARE_PAGES_PROJECT_NAME_SAR、GEOVERSE_CLONE_TOKEN（typedoc/构建期
# 仍需 sibling geoverse 供 engine-geo 类型解析）。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sar
      - uses: actions/checkout@v4
        with:
          repository: Yoy0o/geoverse
          token: ${{ secrets.GEOVERSE_CLONE_TOKEN }}
          path: geoverse

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sar/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            sar/pnpm-lock.yaml
            geoverse/pnpm-lock.yaml

      - name: Build linked geoverse packages
        working-directory: geoverse
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@geoverse/editor-core..." --filter "@geoverse/core-ol..." build

      - name: Install & build packages
        working-directory: sar
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build docs (typedoc + vitepress)
        working-directory: sar
        run: pnpm docs:build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sar/docs/.vitepress/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_SAR }}
